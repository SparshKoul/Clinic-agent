<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunrise Multispeciality Clinic - AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --accent: #0d9488;
      --bg-canvas: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    /* Header */
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
    }

    .status-dot.disconnected {
      background: var(--danger);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .session-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-canvas);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-family: monospace;
    }

    .btn-new-chat {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-new-chat:hover {
      background: #bae6fd;
    }

    /* Chat Messages Window */
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      background: #f8fafc;
    }

    .message-row {
      display: flex;
      gap: 0.75rem;
      max-width: 85%;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.assistant {
      align-self: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .avatar.assistant {
      background: #0284c7;
      color: white;
    }

    .avatar.user {
      background: #475569;
      color: white;
    }

    .bubble {
      padding: 0.875rem 1.125rem;
      border-radius: 16px;
      font-size: 0.925rem;
      line-height: 1.55;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .message-row.user .bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-row.assistant .bubble {
      background: white;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .bubble p {
      margin-bottom: 0.5rem;
    }
    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble ul, .bubble ol {
      margin-left: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .bubble strong {
      color: inherit;
    }

    /* Live Tool Status Indicator */
    .status-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #f1f5f9;
      border-radius: 20px;
      align-self: flex-start;
      margin-left: 42px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      animation: fadeIn 0.3s ease-in-out;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Booking Confirmation Card */
    .booking-card {
      align-self: flex-start;
      margin-left: 42px;
      background: white;
      border: 1.5px solid #0284c7;
      border-radius: 14px;
      padding: 1rem 1.25rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
      animation: fadeIn 0.3s ease-in-out;
    }

    .booking-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .booking-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #0369a1;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge-status {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      background: #dcfce7;
      color: #15803d;
    }

    .badge-status.cancelled {
      background: #fee2e2;
      color: #b91c1c;
    }

    .booking-card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      font-size: 0.85rem;
    }

    .booking-card-item {
      display: flex;
      flex-direction: column;
    }

    .booking-card-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .booking-card-value {
      font-weight: 600;
      color: var(--text-main);
    }

    /* Quick Suggestion Chips */
    .quick-chips {
      padding: 0.5rem 1.5rem 0 1.5rem;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      background: white;
    }

    .quick-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #334155;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
      border-color: #7dd3fc;
    }

    /* Footer Input */
    footer {
      padding: 0.75rem 1.5rem 1.25rem 1.5rem;
      background: white;
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 0.4rem 0.5rem 0.4rem 1rem;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    #chat-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.95rem;
      color: var(--text-main);
      resize: none;
      max-height: 120px;
    }

    .btn-send {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.1rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-send:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-send:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Error Toast */
    .error-banner {
      background: #fef2f2;
      border-left: 4px solid var(--danger);
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      color: #991b1b;
      margin-left: 42px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <header>
    <div class="brand">
      <div class="logo-badge">✦</div>
      <div>
        <div class="brand-title">Sunrise Multispeciality Clinic</div>
        <div class="brand-subtitle">
          <span id="conn-dot" class="status-dot"></span>
          <span id="conn-status">Online • AI Assistant</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <span class="session-tag" id="session-tag" title="Session Identifier">Session: ...</span>
      <button class="btn-new-chat" id="btn-new-chat" title="Start fresh conversation">New Chat</button>
    </div>
  </header>

  <!-- Messages History -->
  <div class="chat-history" id="chat-history"></div>

  <!-- Quick Prompts -->
  <div class="quick-chips">
    <button class="chip" onclick="quickFill('Hi, I am Priya Nair (+91 90000 10111). Can you check my appointments?')">Existing Patient (Priya Nair)</button>
    <button class="chip" onclick="quickFill('I have loose motions since morning and vomited 2 times. Feeling very weak.')">Gastroenteritis Symptoms</button>
    <button class="chip" onclick="quickFill('My chest feels heavy and the pain is going to my left arm, I am sweating.')">Emergency Warning</button>
    <button class="chip" onclick="quickFill('Can I book an appointment with the cardiologist on Sunday?')">Sunday Booking Check</button>
  </div>

  <!-- Footer Input Area -->
  <footer>
    <div class="input-wrapper">
      <input type="text" id="chat-input" placeholder="Type your symptoms, inquiry, or appointment request..." autocomplete="off">
      <button class="btn-send" id="btn-send">
        <span>Send</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </footer>
</div>

<script>
  // Session & Connection Management
  let sessionId = sessionStorage.getItem('clinic_session_id');
  if (!sessionId) {
    sessionId = 'session_' + Math.random().toString(36).substring(2, 9);
    sessionStorage.setItem('clinic_session_id', sessionId);
  }
  document.getElementById('session-tag').textContent = sessionId.substring(0, 12);

  let ws = null;
  let isWaitingForResponse = false;
  const chatHistory = document.getElementById('chat-history');
  const chatInput = document.getElementById('chat-input');
  const btnSend = document.getElementById('btn-send');
  const connDot = document.getElementById('conn-dot');
  const connStatus = document.getElementById('conn-status');

  function connectWebSocket() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws/chat?session_id=${encodeURIComponent(sessionId)}`;
    
    connStatus.textContent = 'Connecting...';
    connDot.className = 'status-dot';
    
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      connStatus.textContent = 'Online • AI Assistant';
      connDot.className = 'status-dot';
      setWaiting(false);
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        handleServerEvent(data);
      } catch (err) {
        console.error('Failed to parse WebSocket message:', event.data, err);
      }
    };

    ws.onclose = () => {
      connStatus.textContent = 'Reconnecting...';
      connDot.className = 'status-dot disconnected';
      setTimeout(connectWebSocket, 2000);
    };

    ws.onerror = (err) => {
      console.error('WebSocket Error:', err);
      ws.close();
    };
  }

  function handleServerEvent(data) {
    // Clear any active temporary tool status container
    clearStatusIndicator();

    switch (data.type) {
      case 'assistant_message':
        renderAssistantMessage(data.text);
        setWaiting(false);
        break;

      case 'status':
        renderStatusIndicator(data.text);
        break;

      case 'booking':
        renderBookingCard(data.appointment);
        break;

      case 'error':
        renderErrorMessage(data.text);
        setWaiting(false);
        break;

      default:
        console.log('Received unknown message type:', data);
    }
  }

  function setWaiting(waiting) {
    isWaitingForResponse = waiting;
    btnSend.disabled = waiting;
    if (!waiting) {
      chatInput.focus();
    }
  }

  function renderUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'message-row user';
    row.innerHTML = `
      <div class="avatar user">You</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    chatHistory.appendChild(row);
    scrollToBottom();
  }

  function renderAssistantMessage(text) {
    const row = document.createElement('div');
    row.className = 'message-row assistant';
    
    // Parse markdown into HTML safely using marked.js
    const parsedHtml = marked.parse(text || '');
    
    row.innerHTML = `
      <div class="avatar assistant">✦</div>
      <div class="bubble">${parsedHtml}</div>
    `;
    chatHistory.appendChild(row);
    scrollToBottom();
  }

  function renderStatusIndicator(text) {
    clearStatusIndicator();
    const container = document.createElement('div');
    container.id = 'active-status-indicator';
    container.className = 'status-container';
    container.innerHTML = `
      <div class="pulse-dot"></div>
      <span>${escapeHtml(text)}</span>
    `;
    chatHistory.appendChild(container);
    scrollToBottom();
  }

  function clearStatusIndicator() {
    const active = document.getElementById('active-status-indicator');
    if (active) {
      active.remove();
    }
  }

  function renderBookingCard(app) {
    if (!app) return;
    const card = document.createElement('div');
    card.className = 'booking-card';

    const statusClass = (app.status === 'cancelled') ? 'badge-status cancelled' : 'badge-status';

    card.innerHTML = `
      <div class="booking-card-header">
        <div class="booking-card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Appointment Details
        </div>
        <span class="${statusClass}">${escapeHtml(app.status || 'scheduled')}</span>
      </div>
      <div class="booking-card-body">
        <div class="booking-card-item">
          <span class="booking-card-label">Doctor</span>
          <span class="booking-card-value">${escapeHtml(app.doctor || 'Dr. Assigned')}</span>
        </div>
        <div class="booking-card-item">
          <span class="booking-card-label">Specialty</span>
          <span class="booking-card-value">${escapeHtml(app.specialty || 'General')}</span>
        </div>
        <div class="booking-card-item">
          <span class="booking-card-label">Date</span>
          <span class="booking-card-value">${escapeHtml(app.date || '')}</span>
        </div>
        <div class="booking-card-item">
          <span class="booking-card-label">Time</span>
          <span class="booking-card-value">${escapeHtml(app.start_time || '')}</span>
        </div>
        <div class="booking-card-item">
          <span class="booking-card-label">Booking ID</span>
          <span class="booking-card-value">#${escapeHtml(String(app.id || 'N/A'))}</span>
        </div>
      </div>
    `;
    chatHistory.appendChild(card);
    scrollToBottom();
  }

  function renderErrorMessage(text) {
    const banner = document.createElement('div');
    banner.className = 'error-banner';
    banner.textContent = 'Notice: ' + text;
    chatHistory.appendChild(banner);
    scrollToBottom();
  }

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || isWaitingForResponse || !ws || ws.readyState !== WebSocket.OPEN) return;

    renderUserMessage(text);
    chatInput.value = '';
    setWaiting(true);

    const payload = {
      type: 'user_message',
      text: text
    };
    ws.send(JSON.stringify(payload));
  }

  function quickFill(text) {
    chatInput.value = text;
    sendMessage();
  }

  function scrollToBottom() {
    chatHistory.scrollTop = chatHistory.scrollHeight;
  }

  function escapeHtml(string) {
    return String(string)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // Event Listeners
  btnSend.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById('btn-new-chat').addEventListener('click', () => {
    sessionId = 'session_' + Math.random().toString(36).substring(2, 9);
    sessionStorage.setItem('clinic_session_id', sessionId);
    document.getElementById('session-tag').textContent = sessionId.substring(0, 12);
    chatHistory.innerHTML = '';
    if (ws) ws.close();
  });

  // Start connection
  connectWebSocket();
</script>

</body>
</html>
